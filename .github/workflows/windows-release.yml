name: Windows x64 - build, tests and installer

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (X.Y.Z or X.Y.Z-tag.N); defaults to windows/Directory.Build.props'
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Build the Windows solution
        id: build
        run: dotnet build OpenClicky.Windows.sln -c Release -p:RestoreLockedMode=true

      - name: Run the Windows Core tests
        id: tests
        run: >
          dotnet test tests/OpenClicky.Core.Tests -c Release --no-build
          --logger 'trx;LogFileName=windows-x64.trx' --results-directory "${{ runner.temp }}/pley-test-results"

      - name: Keep the test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-test-results
          path: ${{ runner.temp }}/pley-test-results/windows-x64.trx
          if-no-files-found: error

      - name: Summarize the test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          PLEY_TEST_RESULTS: ${{ runner.temp }}/pley-test-results/windows-x64.trx
        run: |
          [xml] $report = Get-Content -LiteralPath $env:PLEY_TEST_RESULTS -Raw
          $counts = $report.TestRun.ResultSummary.Counters
          @(
            '### Windows x64 Core tests'
            ''
            "| Total | Passed | Failed | Skipped |"
            "| --- | --- | --- | --- |"
            "| $($counts.total) | $($counts.passed) | $($counts.failed) | $($counts.notExecuted) |"
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Build the Velopack installer
        id: package
        if: ${{ !cancelled() && github.event_name != 'push' && steps.build.outcome == 'success' }}
        env:
          PLEY_BUILD_VERSION: ${{ inputs.version }}
        run: ./installer/build-release.ps1 -Version $env:PLEY_BUILD_VERSION

      - name: Keep the installer with this run
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PleyCompanion-windows-x64
          path: |
            windows/Releases/win-x64/PleyCompanion-Setup.exe
            windows/Releases/win-x64/SHA256SUMS.txt
          if-no-files-found: error


      - name: Measure and capture the Windows launcher
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'launcher-probe'
          $process = Start-Process 'publish/win-x64/PleyCompanion.exe' -Wait -PassThru -ArgumentList @('--pley-smoke-launcher', ('"{0}"' -f $folder))
          if ($process.ExitCode -ne 0) { Get-Content "$folder/error.txt"; throw "Launcher probe failed" }
          Get-Content "$folder/timings.txt" | Tee-Object -Variable measurements
          $measurements >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: windows-x64-launcher
          path: ${{ runner.temp }}/launcher-probe/

      - name: Verify French CPU voice
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'windows-x64-voice.txt'
          $app = Resolve-Path 'publish/win-x64/PleyCompanion.exe'
          $process = Start-Process -FilePath $app -PassThru -Wait -ArgumentList @('--pley-smoke-voice-fr', ('"{0}"' -f $report))
          if (Test-Path $report) {
            '### French CPU voice' >> $env:GITHUB_STEP_SUMMARY
            Get-Content $report | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) { throw "French voice smoke failed with exit code $($process.ExitCode)." }

      - name: Probe Win32 clipboard on the hosted desktop
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'windows-x64-clipboard.txt'
          $app = Resolve-Path 'publish/win-x64/PleyCompanion.exe'
          $process = Start-Process -FilePath $app -PassThru -Wait -ArgumentList @('--pley-smoke-clipboard', ('"{0}"' -f $report))
          if (Test-Path $report) {
            '### Win32 clipboard on the hosted desktop' >> $env:GITHUB_STEP_SUMMARY
            Get-Content $report | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
            Get-Content $report
          }
          if ($process.ExitCode -ne 0) { throw "Win32 clipboard probe failed with exit code $($process.ExitCode)." }

      - name: Verify upgrade from launcher 0.12.3 and fresh launch
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'pley-launcher-baseline'
          git worktree add --detach $baseline c9d19d8b045c4122835538a7af53f97d8a602811
          & (Join-Path $baseline 'windows/installer/build-release.ps1')
          ./scripts/test-upgrade.ps1 -BaselineInstaller (Join-Path $baseline 'windows/Releases/win-x64/PleyCompanion-Setup.exe') `
              -ExpectedBaselineVersion '0.12.3.0' -Installer 'Releases/win-x64/PleyCompanion-Setup.exe' | Tee-Object -Variable outcomes
          '### Installation and upgrade' >> $env:GITHUB_STEP_SUMMARY
          $outcomes | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the French voice measurements
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-voice-measurements
          path: |
            ${{ runner.temp }}/windows-x64-voice.txt
            ${{ runner.temp }}/windows-x64-clipboard.txt
          if-no-files-found: warn
